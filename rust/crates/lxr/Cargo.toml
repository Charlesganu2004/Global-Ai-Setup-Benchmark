[package]
name = "lxr"
description = "One local index for coding agents: definitions, callers, search, graph and memory"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "pgr"
path = "src/main.rs"

[features]
# Compiles the embedding model into the program (include_bytes! of tokenizer.json and
# model.safetensors), so that pgr finds it however the executable was installed. The build needs
# the environment variable PGR_EMBED_MODEL_DIR: the absolute path of the folder that holds the two
# files. Without the variable the build stops with an error that says so.
embedded-model = []

[dependencies]
lxr-core.workspace = true
lxr-extract.workspace = true
lxr-text.workspace = true
lxr-graph.workspace = true
lxr-rag.workspace = true
lxr-memory.workspace = true
serde.workspace = true
serde_json.workspace = true
lexopt.workspace = true
rayon.workspace = true
